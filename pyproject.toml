[project]
name = "antipolo-disease-surveillance"
version = "1.0.0"
description = "Hybrid SARIMA+NNAR disease surveillance and forecasting dashboard for Antipolo City (Region 4-A)"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.17,<5",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2", "flake8>=7.0", "radon>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dashboard*"]
