[project]
name = "antipolo-disease-surveillance"
version = "1.0.0"
description = "Monthly ICD-10 consultation dashboard with Prophet + XGBoost architecture and projected rankings"
requires-python = ">=3.12"
dependencies = [
    "dash==4.4.1",
    "plotly==7.0.0",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "openpyxl==3.1.5",
    "gunicorn==26.2.0",
    "prophet==1.5.0",
    "xgboost==3.4.1",
    "threadpoolctl==3.7.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2", "flake8>=7.0", "radon>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", "evidence", "reconciliation", ".venv", ".browser-tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dashboard*"]
