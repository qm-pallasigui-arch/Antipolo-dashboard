[project]
name = "antipolo-disease-surveillance"
version = "1.0.0"
description = "Hybrid SARIMA+NNAR disease surveillance and forecasting dashboard for Antipolo City (Region 4-A)"
requires-python = ">=3.10"
dependencies = [
    "dash==4.4.1",
    "plotly==7.0.0",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.0",
    "openpyxl==3.1.5",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2", "flake8>=7.0", "radon>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dashboard*"]
